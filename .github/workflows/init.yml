name: Initialize Template Repo
on:
  push:
  workflow_dispatch:
    inputs:
      side:
        description: Mod side to generate
        required: true
        type: choice
        default: both
        options:
          - both
          - server
          - client

permissions:
  contents: write

jobs:
  cleanup:
    name: "Initialize Repo"
    runs-on: ubuntu-24.04
    if: github.event.repository.name != 'LegacyMinecraftModTemplate'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java for formatting
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Initialize repository
        shell: bash
        env:
          # A push (a repository made with "Use this template") has no inputs, so it gets both.
          INIT_SIDE: ${{ inputs.side || 'both' }}
        run: |
          set -euo pipefail
          if [ ! -f init.sh ]; then
            echo "Repository is already initialized."
            exit 0
          fi

          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          owner="${repository_owner,,}"
          package_owner=$(printf '%s' "$owner" | tr -cd 'a-z0-9_')
          modid=$(printf '%s' "${repository_name,,}" | tr -cd 'a-z0-9_')
          project_name=$(printf '%s' "$repository_name" | tr -cd 'A-Za-z0-9_')
          if [[ "$package_owner" =~ ^[0-9] ]]; then package_owner="user${package_owner}"; fi
          if [[ "$modid" =~ ^[0-9] ]]; then modid="mod${modid}"; fi
          if [[ "$project_name" =~ ^[0-9] ]]; then project_name="Mod${project_name}"; fi
          package_name="com.github.${package_owner}.${modid}"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          ./init.sh --side="$INIT_SIDE" "$package_name" "$project_name" "$modid" "$repository_owner"
          git add --all
          git commit -m "Initialize template repository" \
            -m "Set package name to ${package_name}, project name to ${project_name}, and mod id to ${modid}." \
            -m "Set mod side to ${INIT_SIDE}."
          git push origin "HEAD:${GITHUB_REF_NAME}"
